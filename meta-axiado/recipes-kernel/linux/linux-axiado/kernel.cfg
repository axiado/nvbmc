# Overlay Filesystem
CONFIG_OVERLAY_FS=y

# IPMI host-side interfaces
CONFIG_IPMI_SI=y
CONFIG_IPMI_SSIF=y
CONFIG_IPMI_IPMB=y
CONFIG_IPMI_DEVICE_INTERFACE=y

# IPMI BMC-side interfaces
CONFIG_SSIF_IPMI_BMC=y
CONFIG_SEPARATE_SSIF_POSTCODES=y
CONFIG_IPMB_DEVICE_INTERFACE=y

# EFI (also enables EFI_STUB, DMI, EFI_ESRT, IPMI_DMI_DECODE, PCI_LABEL, etc.)
CONFIG_EFI=y
