# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ax-nvidia-gb200nvl-layer"
BBFILE_PATTERN_ax-nvidia-gb200nvl-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_ax-nvidia-gb200nvl-layer = "20"
LAYERSERIES_COMPAT_ax-nvidia-gb200nvl-layer = "nanbield scarthgap whinlatter walnascar"
